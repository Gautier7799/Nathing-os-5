name: Lawnchair 16 Nothing core build

on:
  pull_request:
    paths:
      - "patches/lawnchair16/**"
      - ".github/workflows/lawnchair16-build.yml"
  push:
    branches:
      - "integration/lawnchair16-nothing-core"
    paths:
      - "patches/lawnchair16/**"
      - ".github/workflows/lawnchair16-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lawnchair-nothing:
    name: Patch and build Lawnchair 16 Nothing flavor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Nothing OS 5 integration patch
        uses: actions/checkout@v4

      - name: Checkout Lawnchair 16 with required source submodules
        uses: actions/checkout@v4
        with:
          repository: LawnchairLauncher/lawnchair
          ref: 16-dev
          path: lawnchair-src
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Validate and apply Nothing core patch
        shell: bash
        run: |
          set -euo pipefail
          patch --dry-run -p1 < "$GITHUB_WORKSPACE/patches/lawnchair16/nothing-core-migration.patch"
          patch -p1 < "$GITHUB_WORKSPACE/patches/lawnchair16/nothing-core-migration.patch"
          grep -F 'applicationId "com.example.nothinglauncher"' build.gradle
          grep -F 'final def version = "16.1-Nothing"' build.gradle
          grep -F 'BoolPref("pref_hotseatBG", true, recreate)' lawnchair/src/app/lawnchair/preferences/PreferenceManager.kt
          grep -F 'private const val CURRENT_VERSION = 3' lawnchair/src/app/lawnchair/preferences/PreferenceManager.kt
        working-directory: lawnchair-src

      - name: Build Nothing OS 5 release APK
        working-directory: lawnchair-src
        run: ./gradlew assembleLawnWithQuickstepNothingRelease --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-OS-5-Lawnchair16-Release
          path: lawnchair-src/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
